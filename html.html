<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hứng Táo</title>
    <style>
        /* === CSS: Giao diện và tạo kiểu === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .scoreboard {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            width: 400px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        /* Khung hiển thị Game (Canvas) */
        #gameCanvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: block;
            cursor: none; /* Ẩn con trỏ chuột khi vào khung game */
        }

        /* Thẻ thông báo Game Over */
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            display: none; /* Ẩn đi khi đang chơi */
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .btn-restart {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-restart:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>HỨNG TÁO RƠI 🍎</h1>
        
        <div class="scoreboard">
            <div>Điểm: <span id="score">0</span></div>
            <div>Mạng: <span id="lives">❤️❤️❤️</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <!-- Màn hình thua cuộc -->
        <div class="game-over-screen" id="gameOverScreen">
            <h2>THUA CỘC! 🔥</h2>
            <p>Tổng điểm của bạn: <span id="finalScore">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Chơi lại</button>
        </div>
    </div>

    <!-- === JAVASCRIPT: Xử lý logic Game === -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Các biến lưu trạng thái game
        let score = 0;
        let lives = 3;
        let isGameOver = false;

        // Cấu hình Giỏ hứng
        const basket = {
            width: 80,
            height: 18,
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            speed: 7,
            dx: 0
        };

        // Cấu hình Quả táo
        const apple = {
            x: Math.random() * (canvas.width - 20) + 10,
            y: 0,
            radius: 12,
            speed: 3
        };

        // Bàn phím điều khiển
        const keys = { right: false, left: false };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        });

        // Điều khiển bằng chuột
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            basket.x = mouseX - basket.width / 2;
        });

        // Vẽ Giỏ
        function drawBasket() {
            ctx.fillStyle = '#8B4513'; // Màu nâu
            ctx.beginPath();
            ctx.roundRect(basket.x, basket.y, basket.width, basket.height, 5);
            ctx.fill();
        }

        // Vẽ Táo
        function drawApple() {
            ctx.beginPath();
            ctx.arc(apple.x, apple.y, apple.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c'; // Màu đỏ
            ctx.fill();
            ctx.closePath();

            // Vẽ cuống táo
            ctx.beginPath();
            ctx.rect(apple.x - 1, apple.y - apple.radius - 3, 2, 4);
            ctx.fillStyle = '#27ae60'; // Màu xanh
            ctx.fill();
            ctx.closePath();
        }

        // Tạo vị trí ngẫu nhiên mới cho Quả Táo
        function resetApple() {
            apple.x = Math.random() * (canvas.width - 30) + 15;
            apple.y = 0;
            // Tăng tốc độ táo rơi nhẹ theo thời gian/điểm số
            apple.speed = 3 + Math.floor(score / 50) * 0.5; 
        }

        // Cập nhật tọa độ và xử lý va chạm
        function update() {
            if (isGameOver) return;

            // Xử lý di chuyển giỏ bằng phím
            if (keys.right && basket.x < canvas.width - basket.width) {
                basket.x += basket.speed;
            }
            if (keys.left && basket.x > 0) {
                basket.x -= basket.speed;
            }

            // Giới hạn giỏ không chạy ra ngoài viền
            if (basket.x < 0) basket.x = 0;
            if (basket.x + basket.width > canvas.width) basket.x = canvas.width - basket.width;

            // Cho táo rơi xuống
            apple.y += apple.speed;

            // Xử lý va chạm: Giỏ hứng được táo
            if (
                apple.y + apple.radius >= basket.y &&
                apple.x >= basket.x &&
                apple.x <= basket.x + basket.width
            ) {
                score += 10;
                document.getElementById('score').innerText = score;
                resetApple();
            }

            // Xử lý khi táo rơi ra ngoài màn hình (Bị hụt)
            if (apple.y - apple.radius > canvas.height) {
                lives--;
                updateLivesDisplay();
                
                if (lives <= 0) {
                    endGame();
                } else {
                    resetApple();
                }
            }
        }

        // Hiển thị tim tương ứng số mạng còn lại
        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            document.getElementById('lives').innerText = hearts || '💀';
        }

        // Hàm kết thúc trò chơi
        function endGame() {
            isGameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // Hàm reset để chơi lại
        function resetGame() {
            score = 0;
            lives = 3;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            updateLivesDisplay();
            document.getElementById('gameOverScreen').style.display = 'none';
            resetApple();
            gameLoop();
        }

        // Vẽ lại toàn bộ màn hình
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Xóa màn hình cũ
            drawBasket();
            drawApple();
        }

        // Vòng lặp chính của Game
        function gameLoop() {
            if (!isGameOver) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // Khởi động Game
        gameLoop();
    </script>
</body>
</html>
